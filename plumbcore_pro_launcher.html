<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3b5a">
<title>PLUMBCORE Pro</title>
<style>
:root{--navy:#0f3a57;--green:#48a942;--bg:#f3f6f8;--text:#142438;--muted:#6d7885;--line:#d8e1e7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.wrap{min-height:100dvh;display:flex;flex-direction:column}.hero{background:linear-gradient(135deg,#082f4a,#0f5168);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 24px 30px}.brand{max-width:520px;margin:auto}.brand h1{font-size:34px;margin:0;font-weight:850;letter-spacing:-1px}.brand h1 span{color:#59b843}.brand p{margin:6px 0 0;font-size:18px}.tag{color:#72cb5d!important;font-size:15px!important}main{width:min(100%,520px);margin:0 auto;padding:24px 20px 80px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 24px rgba(13,59,90,.06)}h2{margin:0 0 8px;font-size:27px}.lead{color:var(--muted);line-height:1.5;margin:0 0 20px}.price{font-size:36px;font-weight:850;color:#2f8b36;margin:10px 0}.price small{font-size:15px;color:var(--muted);font-weight:600}button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#e7edf1;color:#17324c;margin-top:10px}.link{background:transparent;color:#356b8d;margin-top:8px}.sep{height:1px;background:var(--line);margin:22px 0}label{font-weight:750;display:block;margin-bottom:8px}input{width:100%;font-size:17px;padding:14px 15px;border-radius:14px;border:1px solid #cbd7df;background:#fff}.msg{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.good{background:#e8f5e9;color:#226b28;padding:14px;border-radius:14px;font-weight:800}.bad{background:#fff1ef;color:#a23a2f;padding:14px;border-radius:14px;font-weight:700}.spinner{width:34px;height:34px;border:4px solid #dbe4ea;border-top-color:#3f8c42;border-radius:50%;animation:s 1s linear infinite;margin:18px auto}@keyframes s{to{transform:rotate(360deg)}}small.foot{display:block;color:var(--muted);text-align:center;margin-top:18px;line-height:1.45}
</style></head>
<body><div class="wrap"><header class="hero"><div class="brand"><h1>PLUMB<span>CORE</span></h1><p>Plumbing &amp; Heating</p><p class="tag">Run the job. Run the business.</p></div></header><main><div class="card" id="panel"><div class="spinner"></div><p class="lead" style="text-align:center">Checking PLUMBCORE access…</p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hhkfubazagepyjwpllzu.supabase.co';
const SUPABASE_KEY='sb_publishable_HCCeuwqSy8foo58aPbDnIw_slPwOI62';
const SUBSCRIBE_URL='https://buy.stripe.com/3cI14n7wyfDA6Qu1Pb3ZK01';
const STATUS_URL=SUPABASE_URL+'/functions/v1/subscription-status';
const APP_URL=SUPABASE_URL+'/functions/v1/protected-app';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
const panel=document.getElementById('panel');
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function retireOldOfflineCopy(){try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}}catch(e){console.warn(e)}}
function signedOut(message=''){panel.innerHTML=`<h2>PLUMBCORE Pro</h2><p class="lead">Professional job, customer, quote, invoice, payment and technical tools for plumbers and heating engineers.</p><div class="price">£9.99 <small>/ month</small></div><a class="btn primary" href="${SUBSCRIBE_URL}" target="_blank" rel="noopener">Subscribe to PLUMBCORE Pro</a><div class="sep"></div><h2 style="font-size:21px">Already subscribed?</h2><p class="lead">Use the same email address you entered at checkout.</p><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button class="secondary" id="signin">Email me a secure sign-in link</button>${message?`<p class="msg">${esc(message)}</p>`:''}<small class="foot">Your subscription is checked securely before the app is loaded.</small>`;document.getElementById('signin').onclick=sendLink}
async function sendLink(){const input=document.getElementById('email'),b=document.getElementById('signin');const email=(input?.value||'').trim();if(!email){signedOut('Enter your email address first.');return}b.disabled=true;b.textContent='Sending…';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});if(error){signedOut(error.message);return}panel.innerHTML='<h2>Check your email</h2><div class="good">Sign-in link sent.</div><p class="lead" style="margin-top:14px">Tap the PLUMBCORE sign-in link in your email. You will return here and your subscription will be checked automatically.</p><button class="secondary" onclick="location.reload()">I have signed in</button>'}
function inactive(session){panel.innerHTML=`<h2>Subscription required</h2><div class="bad">No active PLUMBCORE Pro subscription was found for ${esc(session.user.email)}.</div><p class="lead" style="margin-top:14px">If you have just subscribed, wait a few seconds and check again.</p><a class="btn primary" href="${SUBSCRIBE_URL}" target="_blank" rel="noopener">Subscribe — £9.99/month</a><button class="secondary" id="again">Check subscription again</button><button class="link" id="out">Sign out</button>`;document.getElementById('again').onclick=boot;document.getElementById('out').onclick=async()=>{await sb.auth.signOut();signedOut()}}
async function loadApp(session){panel.innerHTML='<div class="spinner"></div><p class="lead" style="text-align:center">Opening PLUMBCORE Pro…</p>';const r=await fetch(APP_URL,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY},cache:'no-store'});if(!r.ok){if(r.status===401){await sb.auth.signOut();signedOut('Your sign-in has expired. Please sign in again.');return}inactive(session);return}let appHtml=await r.text();appHtml=appHtml.replace(/<head([^>]*)>/i,'<head$1><base href="https://65nzrgzrkd-bit.github.io/tradepro-uk./">');document.open();document.write(appHtml);document.close()}
async function boot(){await retireOldOfflineCopy();const {data:{session}}=await sb.auth.getSession();if(!session){signedOut();return}try{const r=await fetch(STATUS_URL,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY},cache:'no-store'});const j=await r.json();if(r.ok&&j.active)await loadApp(session);else inactive(session)}catch(e){panel.innerHTML='<h2>Connection problem</h2><div class="bad">PLUMBCORE could not verify your subscription right now.</div><button class="secondary" onclick="location.reload()">Try again</button>'}}
sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script></body></html>
