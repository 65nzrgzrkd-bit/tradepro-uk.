<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIXTIVO">
<meta name="application-name" content="FIXTIVO">
<meta name="description" content="FIXTIVO professional job, customer, quote, invoice, payment and technical tools for plumbers and heating engineers.">
<title>FIXTIVO Pro</title>
<style>
:root{--navy:#07131d;--navy2:#0a2f43;--blue:#12c6f3;--green:#26e3a5;--bg:#f3f6f8;--text:#142438;--muted:#6d7885;--line:#d8e1e7;--danger:#a23a2f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.wrap{min-height:100dvh;display:flex;flex-direction:column}.hero{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:calc(24px + env(safe-area-inset-top)) 22px 26px}.brand{width:min(100%,520px);margin:auto}.brandline{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#12c6f3,#26e3a5);display:grid;place-items:center;color:#06131d;font-weight:950;font-size:24px;box-shadow:0 8px 24px rgba(18,198,243,.22)}.brand h1{font-size:33px;margin:0;font-weight:950;letter-spacing:.8px}.brand p{margin:4px 0 0;font-size:16px}.tag{color:#61ddff!important;font-size:13px!important}main{width:min(100%,520px);margin:0 auto;padding:24px 20px calc(80px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 24px rgba(13,59,90,.06)}h2{margin:0 0 8px;font-size:27px}.lead{color:var(--muted);line-height:1.5;margin:0 0 20px}.price{font-size:36px;font-weight:900;color:#087b72;margin:10px 0}.price small{font-size:15px;color:var(--muted);font-weight:600}button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#12b881,#0ca6d1);color:#fff}.secondary{background:#e7edf1;color:#17324c;margin-top:10px}.link{background:transparent;color:#356b8d;margin-top:8px}.sep{height:1px;background:var(--line);margin:22px 0}label{font-weight:750;display:block;margin-bottom:8px}input{width:100%;font-size:17px;padding:14px 15px;border-radius:14px;border:1px solid #cbd7df;background:#fff}.msg{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.good{background:#e8f5e9;color:#226b28;padding:14px;border-radius:14px;font-weight:800;line-height:1.4}.bad{background:#fff1ef;color:var(--danger);padding:14px;border-radius:14px;font-weight:700;line-height:1.4}.info{background:#eef7fb;color:#294b5d;padding:14px;border-radius:14px;line-height:1.45}.spinner{width:34px;height:34px;border:4px solid #dbe4ea;border-top-color:#0ca6d1;border-radius:50%;animation:s 1s linear infinite;margin:18px auto}@keyframes s{to{transform:rotate(360deg)}}small.foot{display:block;color:var(--muted);text-align:center;margin-top:18px;line-height:1.45}.statusrow{display:flex;align-items:center;gap:10px;margin-top:14px;color:#45606f;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#0ca6d1;box-shadow:0 0 0 5px rgba(12,166,209,.1)}
</style></head>
<body><div class="wrap"><header class="hero"><div class="brand"><div class="brandline"><div class="mark">F</div><div><h1>FIXTIVO</h1><p>Plumbing &amp; Heating</p><p class="tag">Run the job. Run the business.</p></div></div></div></header><main><div class="card" id="panel"><div class="spinner"></div><p class="lead" style="text-align:center">Checking FIXTIVO access…</p></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hhkfubazagepyjwpllzu.supabase.co';
const SUPABASE_KEY='sb_publishable_HCCeuwqSy8foo58aPbDnIw_slPwOI62';
const SUBSCRIBE_URL='https://buy.stripe.com/3cI14n7wyfDA6Qu1Pb3ZK01';
const STATUS_URL=SUPABASE_URL+'/functions/v1/subscription-status';
const APP_URL=SUPABASE_URL+'/functions/v1/protected-app';
const HANDOFF_URL=SUPABASE_URL+'/functions/v1/auth-handoff';
const PENDING_KEY='fixtivo_auth_handoff_v1';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
const panel=document.getElementById('panel');
let polling=false;
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function standalone(){return window.matchMedia?.('(display-mode: standalone)').matches===true||window.navigator.standalone===true}
function newHandoffId(){const a=crypto.randomUUID().replaceAll('-',''),b=crypto.randomUUID().replaceAll('-','');return a+b}
function getPending(){try{const p=JSON.parse(localStorage.getItem(PENDING_KEY)||'null');if(!p?.id||!p?.created)return null;if(Date.now()-p.created>15*60*1000){localStorage.removeItem(PENDING_KEY);return null}return p}catch{return null}}
function setPending(id,email){localStorage.setItem(PENDING_KEY,JSON.stringify({id,email,created:Date.now()}))}
function clearPending(){localStorage.removeItem(PENDING_KEY)}
async function retireOldOfflineCopy(){try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}}catch(e){console.warn(e)}}
function signedOut(message=''){panel.innerHTML=`<h2>FIXTIVO Pro</h2><p class="lead">Professional job, customer, quote, invoice, payment and technical tools for plumbers and heating engineers.</p><div class="price">£9.99 <small>/ month</small></div><a class="btn primary" href="${SUBSCRIBE_URL}" target="_blank" rel="noopener">Subscribe to FIXTIVO Pro</a><div class="sep"></div><h2 style="font-size:21px">Already subscribed?</h2><p class="lead">Use the same email address you entered at checkout.</p><label for="email">Email address</label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="you@example.com"><button class="secondary" id="signin">Email me a secure sign-in link</button>${message?`<p class="msg">${esc(message)}</p>`:''}<small class="foot">Your subscription is checked securely before the app is loaded.</small>`;document.getElementById('signin').onclick=sendLink}
function waiting(p,message=''){panel.innerHTML=`<h2>Check your email</h2><div class="good">Secure sign-in link sent${p?.email?` to ${esc(p.email)}`:''}.</div><p class="lead" style="margin-top:14px">Tap the FIXTIVO sign-in link in your email. If it opens in Safari, approve the sign-in there, then return to the FIXTIVO icon on your Home Screen.</p><div class="statusrow"><span class="dot"></span><span id="waitstatus">Waiting for sign-in approval…</span></div>${message?`<p class="msg">${esc(message)}</p>`:''}<button class="secondary" id="checknow">Check now</button><button class="link" id="restart">Use a different email</button><small class="foot">You can switch to Mail or Safari and come back. FIXTIVO will continue automatically.</small>`;document.getElementById('checknow').onclick=()=>claimHandoff(p,true);document.getElementById('restart').onclick=()=>{clearPending();signedOut()};startPolling(p)}
async function sendLink(){const input=document.getElementById('email'),b=document.getElementById('signin');const email=(input?.value||'').trim().toLowerCase();if(!email){signedOut('Enter your email address first.');return}const id=newHandoffId();setPending(id,email);b.disabled=true;b.textContent='Sending…';const redirect=location.origin+location.pathname+'?handoff='+encodeURIComponent(id);const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect,shouldCreateUser:true}});if(error){clearPending();signedOut(error.message);return}waiting({id,email,created:Date.now()})}
async function completeBrowserHandoff(session,id){panel.innerHTML='<div class="spinner"></div><p class="lead" style="text-align:center">Approving FIXTIVO sign-in…</p>';try{const r=await fetch(HANDOFF_URL,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY},body:JSON.stringify({action:'complete',id}),cache:'no-store'});const j=await r.json();if(!r.ok||!j.ready)throw new Error(j.reason||'handoff_failed');history.replaceState({},'',location.pathname);if(standalone()){clearPending();return boot()}panel.innerHTML='<h2>Sign-in approved</h2><div class="good">FIXTIVO is ready on your Home Screen.</div><p class="lead" style="margin-top:14px">Return to the FIXTIVO app icon. It will finish signing you in automatically.</p><small class="foot">You can close this Safari page.</small>'}catch(e){panel.innerHTML='<h2>Could not finish sign-in</h2><div class="bad">The secure handoff could not be completed.</div><p class="lead" style="margin-top:14px">Return to FIXTIVO and request a new sign-in link.</p>'}}
async function claimHandoff(p,manual=false){if(!p?.id)return false;try{const r=await fetch(HANDOFF_URL,{method:'POST',headers:{'content-type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({action:'claim',id:p.id}),cache:'no-store'});if(r.status===202){if(manual){const s=document.getElementById('waitstatus');if(s)s.textContent='Not approved yet — still waiting…'}return false}const j=await r.json();if(!r.ok||!j?.token_hash){if(r.status===410){clearPending();signedOut('That sign-in link expired. Please request a new one.')}return false}const {data,error}=await sb.auth.verifyOtp({token_hash:j.token_hash,type:'magiclink'});if(error||!data?.session)throw error||new Error('Could not create session');clearPending();history.replaceState({},'',location.pathname);await boot();return true}catch(e){console.warn('handoff claim',e);if(manual){const s=document.getElementById('waitstatus');if(s)s.textContent='Still waiting — try again in a moment.'}return false}}
function startPolling(p){if(polling)return;polling=true;let tries=0;const tick=async()=>{const current=getPending();if(!current||current.id!==p.id){polling=false;return}if(document.visibilityState!=='hidden'){const done=await claimHandoff(current,false);if(done){polling=false;return}}tries++;if(tries<450)setTimeout(tick,2000);else polling=false};setTimeout(tick,800)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const p=getPending();if(p)claimHandoff(p,false)}});
function inactive(session){panel.innerHTML=`<h2>Subscription required</h2><div class="bad">No active FIXTIVO Pro subscription was found for ${esc(session.user.email)}.</div><p class="lead" style="margin-top:14px">If you have just subscribed, wait a few seconds and check again.</p><a class="btn primary" href="${SUBSCRIBE_URL}" target="_blank" rel="noopener">Subscribe — £9.99/month</a><button class="secondary" id="again">Check subscription again</button><button class="link" id="out">Sign out</button>`;document.getElementById('again').onclick=boot;document.getElementById('out').onclick=async()=>{await sb.auth.signOut();signedOut()}}
async function loadApp(session){panel.innerHTML='<div class="spinner"></div><p class="lead" style="text-align:center">Opening FIXTIVO Pro…</p>';const r=await fetch(APP_URL,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY},cache:'no-store'});if(!r.ok){if(r.status===401){await sb.auth.signOut();signedOut('Your sign-in has expired. Please sign in again.');return}inactive(session);return}let appHtml=await r.text();appHtml=appHtml.replace(/<head([^>]*)>/i,'<head$1><base href="https://65nzrgzrkd-bit.github.io/tradepro-uk./">');document.open();document.write(appHtml);document.close()}
async function boot(){await retireOldOfflineCopy();const params=new URLSearchParams(location.search);const handoff=params.get('handoff');const {data:{session}}=await sb.auth.getSession();if(session&&handoff){return completeBrowserHandoff(session,handoff)}if(!session){const pending=getPending();if(pending){waiting(pending);return}signedOut();return}try{const r=await fetch(STATUS_URL,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY},cache:'no-store'});const j=await r.json();if(r.ok&&j.active)await loadApp(session);else inactive(session)}catch(e){panel.innerHTML='<h2>Connection problem</h2><div class="bad">FIXTIVO could not verify your subscription right now.</div><button class="secondary" onclick="location.reload()">Try again</button>'}}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&new URLSearchParams(location.search).get('handoff'))setTimeout(()=>completeBrowserHandoff(session,new URLSearchParams(location.search).get('handoff')),0)});
boot();
</script></body></html>
